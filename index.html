<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<title>Presupuesto Familiar</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#6b7886;--br:#e3e8ee;--pri:#0f766e;--in:#16a34a;--eg:#e11d48;--ex:#2563eb;--ds:#d97706;--di:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--card:#16212b;--tx:#e8eef4;--mu:#8a98a6;--br:#243240;--pri:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0d141b;--card:#16212b;--tx:#e8eef4;--mu:#8a98a6;--br:#243240;--pri:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
header h1{font-size:18px;margin:0}
.mn{display:flex;align-items:center;gap:6px}
.mn b{min-width:130px;text-align:center;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:var(--card);border:1px solid var(--br);border-radius:10px;width:36px;height:36px}
.card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#0f766e,#0e4f6b);color:#fff;border:0}
.hero small{opacity:.8}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:12px}
.k small{color:var(--mu);display:block}.k b{font-size:17px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut:after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
.leg{font-size:14px;flex:1}.leg div{display:flex;justify-content:space-between;margin:3px 0}
.tp{cursor:pointer}.tp:active{opacity:.7}
.pg{border-left:5px solid var(--ds);padding-left:10px}.pg.ok{border-left-color:var(--in);background:rgba(22,163,74,.08);border-radius:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bar{height:8px;background:var(--br);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri)}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.it{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--br)}
.it:first-of-type{border-top:0}
.it .n{flex:1;min-width:0}.it .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .n small{color:var(--mu)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--br);background:none;flex:none;font-size:14px;line-height:1;color:#fff}
.chk.on{background:var(--in);border-color:var(--in)}
.pd .n div{text-decoration:line-through;opacity:.55}
.am{font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--br);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--br);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);flex:1;padding:4px}
nav button span{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sh.o{display:flex}
.sh form,.sh .f{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.f label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.f input,.f select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx)}
.f .two{display:flex;gap:8px;margin-top:14px}
.f .two .btn{flex:1}.dl{background:var(--eg)!important}
.chp{background:var(--bg);border:1px solid var(--br);border-radius:20px;padding:6px 12px;font-size:13px}
.note{font-size:13px;color:var(--mu);text-align:center;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
<header><h1>💰 Presupuesto</h1>
<div class="mn"><button class="ib" id="pv">‹</button><b id="ml"></b><button class="ib" id="nx">›</button></div></header>
<main id="m"></main>
</div>
<button class="fab" id="fab" aria-label="Agregar">+</button>
<nav id="nv"></nav>
<div class="sh" id="sh"><div class="f">
<h2 id="st">Nuevo movimiento</h2>
<label>Tipo</label><select id="ty"><option value="ingreso">Ingreso</option><option value="extra">Adicional del mes</option><option value="egreso">Gasto / Egreso</option><option value="desc">Descuento (préstamo/mutual)</option></select>
<label>Concepto</label><div id="ch" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div><input id="nm" placeholder="Ej: Kiosco, Luz, Refrigerio" autocomplete="off">
<label>Monto ($)</label><input id="am" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
<div class="two"><button class="btn s dl" id="dl" style="display:none;color:#fff;margin:0">Eliminar</button><button class="btn s" id="cx" style="margin:0">Cancelar</button><button class="btn" id="sv">Guardar</button></div>
</div></div>
<script>
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const T={ingreso:["Ingresos","var(--in)"],extra:["Adicionales","var(--ex)"],egreso:["Egresos","var(--eg)"],desc:["Descuentos","var(--ds)"]};
const $=id=>document.getElementById(id);
const fm=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let id=0;const uid=()=>Date.now().toString(36)+(id++);
const seed=()=>({"2026-09":[
{id:uid(),t:"ingreso",n:"Sueldo líquido mensual",a:1755925.5},
{id:uid(),t:"ingreso",n:"Docencia",a:100000},
{id:uid(),t:"ingreso",n:"Refuerzo / Bono",a:0},
{id:uid(),t:"ingreso",n:"Aguinaldo",a:0},
{id:uid(),t:"extra",n:"Refrigerio",a:35000},
{id:uid(),t:"egreso",n:"Cuota mensual escuela",a:200000,p:0},
{id:uid(),t:"egreso",n:"Tarjeta Naranja",a:167790.52,p:0},
{id:uid(),t:"egreso",n:"Chejo aire",a:80000,p:0},
{id:uid(),t:"egreso",n:"Kiosco",a:600000,p:0},
{id:uid(),t:"egreso",n:"Mecánico",a:250000,p:0},
{id:uid(),t:"egreso",n:"Personal y Flow",a:64277.01,p:0},
{id:uid(),t:"desc",n:"Débito Tarj. Crédito Tuya (NBCH)",a:239988.2}]});
let S={months:null,cur:"2026-09",tab:"home",diezmo:true};
try{const r=localStorage.getItem("pf_v1");if(r)S=JSON.parse(r)}catch(e){}
if(!S.months)S.months=seed();
if(!S.v){for(const k in S.months){const l=S.months[k],d=l.filter(i=>i.t==="desc").reduce((q,i)=>q+(+i.a||0),0);
const x=l.find(i=>i.n==="Sueldo libre de descuentos");if(x){x.n="Sueldo líquido mensual";x.a=+(x.a+d).toFixed(2)}
if(k==="2026-09"){["Refuerzo / Bono","Aguinaldo"].forEach(n=>{if(!l.some(i=>i.n===n))l.push({id:uid(),t:"ingreso",n,a:0})})}}S.v=2}
const save=()=>{try{localStorage.setItem("pf_v1",JSON.stringify(S))}catch(e){}};
const items=()=>S.months[S.cur]||(S.months[S.cur]=[]);
const sum=t=>items().filter(i=>i.t===t).reduce((s,i)=>s+(+i.a||0),0);
function shift(d){let[y,m]=S.cur.split("-").map(Number);m+=d;if(m>12){m=1;y++}if(m<1){m=12;y--}S.cur=y+"-"+String(m).padStart(2,"0");save();render()}
function calc(){const ing=sum("ingreso"),ext=sum("extra"),eg=sum("egreso");
const pag=items().filter(i=>i.t==="egreso"&&i.p).reduce((s,i)=>s+(+i.a||0),0);
const ds=sum("desc"),saldo=ing-ds-eg,total=saldo+ext,dz=S.diezmo?(ing-ds+ext)*0.1:0;
return{ing,ext,eg,pag,saldo,total,dz,libre:total-dz,desc:ds}}
function list(types,withCheck){const l=items().filter(i=>types.includes(i.t));
if(!l.length)return'<div class="empty">Sin movimientos. Tocá + para agregar.</div>';
return l.map(i=>`<div class="it ${i.p?"pd":""}" data-id="${i.id}">${withCheck&&i.t==="egreso"?`<button class="chk ${i.p?"on":""}" data-ck="${i.id}">${i.p?"✓":""}</button>`:`<span class="dot" style="background:${T[i.t][1]}"></span>`}<div class="n"><div>${esc(i.n)}</div><small>${T[i.t][0]}${i.t==="egreso"?(i.p?" · pagado":" · pendiente"):""}</small></div><span class="am">${fm(i.a)}</span></div>`).join("")}
function render(){const[y,m]=S.cur.split("-");$("ml").textContent=MES[m-1]+" "+y;
const c=calc();let h="";
if(S.tab==="home"){
const tot=c.ing+c.ext+c.eg+c.desc||1;
const seg=[[c.ing,"#16a34a"],[c.ext,"#2563eb"],[c.eg,"#e11d48"],[c.desc,"#d97706"]];let a=0;
const grad=seg.map(([v,col])=>{const s=a;a+=v/tot*100;return`${col} ${s}% ${a}%`}).join(",");
const pct=c.eg?Math.round(c.pag/c.eg*100):0;
h=`<div class="card hero"><small>Disponible del mes (después de diezmo)</small><div class="big">${fm(c.libre)}</div>
<div class="row"><small>Saldo ${fm(c.saldo)}</small><small>+ Adicionales ${fm(c.ext)}</small></div></div>
<div class="grid"><div class="k tp" data-tab="ing"><small>Ingresos brutos ›</small><b style="color:var(--in)">${fm(c.ing)}</b></div><div class="k tp" data-tab="egr"><small>Egresos ›</small><b style="color:var(--eg)">${fm(c.eg)}</b></div>
<div class="k"><small>Diezmo ${S.diezmo?"(10%)":"(off)"}</small><b style="color:var(--di)">${fm(c.dz)}</b></div><div class="k tp" data-tab="des"><small>Descuentos NBCH/mutuales ›</small><b style="color:var(--ds)">${fm(c.desc)}</b></div></div>
<div class="card"><h2>Distribución</h2><div class="row" style="gap:14px"><div class="donut" style="background:conic-gradient(${grad})"></div><div class="leg">${Object.keys(T).map(k=>`<div><span><span class="dot" style="background:${T[k][1]}"></span>${T[k][0]}</span><b>${Math.round(sum(k)/tot*100)}%</b></div>`).join("")}</div></div></div>
<div class="card tp" data-tab="pag"><h2>Gastos pagados ›</h2><div class="row"><b>${fm(c.pag)}</b><small style="color:var(--mu)">de ${fm(c.eg)} · ${pct}%</small></div><div class="bar"><i style="width:${pct}%"></i></div></div>
<div class="card"><h2>Ajustes</h2><button class="btn s" id="dz" style="margin:0">Diezmo 10%: ${S.diezmo?"activado":"desactivado"}</button>
<button class="btn s" id="cp">Copiar fijos del mes anterior</button><button class="btn s" id="ex">Copiar respaldo</button><button class="btn s" id="im">Restaurar respaldo</button>
<div class="note">Tus datos se guardan en este navegador/teléfono.</div></div>`}
else if(S.tab==="pag"){const e=items().filter(i=>i.t==="egreso"),pe=e.filter(i=>!i.p),pa=e.filter(i=>i.p);const pct=c.eg?Math.round(c.pag/c.eg*100):0;
const row=i=>`<div class="it pg ${i.p?"ok pd":""}" data-id="${i.id}"><button class="chk ${i.p?"on":""}" data-ck="${i.id}">${i.p?"✓":""}</button><div class="n"><div>${esc(i.n)}</div></div><span class="am">${fm(i.a)}</span></div>`;
h=`<div class="card hero"><small>Por pagar</small><div class="big">${fm(c.eg-c.pag)}</div><div class="row"><small>Pagado ${fm(c.pag)}</small><small>${pa.length} de ${e.length} · ${pct}%</small></div><div class="bar"><i style="width:${pct}%;background:#fff"></i></div></div>
<div class="card"><h2>⏳ Por pagar (${pe.length})</h2>${pe.length?pe.map(row).join(""):'<div class="empty">¡Todo pagado! 🎉</div>'}</div>
<div class="card"><h2>✅ Pagados (${pa.length})</h2>${pa.length?pa.map(row).join(""):'<div class="empty">Todavía no pagaste nada</div>'}</div>
<button class="btn s" id="rs">Reiniciar tildes del mes</button>`}
else if(S.tab==="ing")h=`<div class="card"><h2>Ingresos · sueldo, bono, aguinaldo</h2>${list(["ingreso","extra"])}</div><div class="grid"><div class="k"><small>Ingresos</small><b>${fm(c.ing)}</b></div><div class="k"><small>Adicionales</small><b>${fm(c.ext)}</b></div></div>`;
else if(S.tab==="egr")h=`<div class="card"><h2>Egresos · tocá el círculo al pagar</h2>${list(["egreso"],1)}</div><div class="k"><small>Total egresos</small><b>${fm(c.eg)}</b></div>`;
else h=`<div class="card"><h2>Descuentos (se restan del sueldo líquido)</h2>${list(["desc"])}</div><div class="k"><small>Total descuentos</small><b>${fm(c.desc)}</b></div>`;
$("m").innerHTML=h;
$("nv").innerHTML=[["home","📊","Resumen"],["ing","⬆️","Ingresos"],["egr","⬇️","Egresos"],["pag","✅","Pagos"],["des","🏦","Descuentos"]].map(([k,e,l])=>`<button class="${S.tab===(k==="des"?"des":k)?"on":""}" data-tab="${k}"><span>${e}</span>${l}</button>`).join("");
$("fab").style.display=S.tab==="home"||S.tab==="pag"?"none":"block"}
let ed=null;
function open(i){ed=i||null;$("st").textContent=i?"Editar":"Nuevo movimiento";
$("ty").value=i?i.t:({ing:"ingreso",egr:"egreso",des:"desc"}[S.tab]||"egreso");$("nm").value=i?i.n:"";$("am").value=i?i.a:"";
chips();$("dl").style.display=i?"block":"none";$("sh").classList.add("o");setTimeout(()=>$("nm").focus(),80)}
const CH={ingreso:["Sueldo líquido mensual","Refuerzo / Bono","Aguinaldo","Docencia"],extra:["Refrigerio","Productividad"],egreso:[],desc:[]};
function chips(){$("ch").innerHTML=(CH[$("ty").value]||[]).map(c=>`<button type="button" class="chp" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
$("ty").onchange=chips;$("ch").onclick=e=>{const b=e.target.closest("[data-c]");if(b){$("nm").value=b.dataset.c;$("am").focus()}};
const close=()=>$("sh").classList.remove("o");
$("sv").onclick=()=>{const n=$("nm").value.trim(),a=parseFloat($("am").value);if(!n||isNaN(a)){alert("Completá concepto y monto");return}
if(ed){ed.t=$("ty").value;ed.n=n;ed.a=a}else items().push({id:uid(),t:$("ty").value,n,a,p:0});save();close();render()};
$("cx").onclick=close;$("sh").onclick=e=>{if(e.target===$("sh"))close()};
$("dl").onclick=()=>{if(confirm("¿Eliminar?")){S.months[S.cur]=items().filter(x=>x!==ed);save();close();render()}};
$("fab").onclick=()=>open();$("pv").onclick=()=>shift(-1);$("nx").onclick=()=>shift(1);
document.addEventListener("click",e=>{const t=e.target;
const ck=t.closest("[data-ck]");if(ck){const i=items().find(x=>x.id===ck.dataset.ck);i.p=i.p?0:1;save();render();return}
const tb=t.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;scrollTo(0,0);render();return}
const it=t.closest(".it");if(it){open(items().find(x=>x.id===it.dataset.id));return}
if(t.id==="rs"&&confirm("¿Destildar todos los gastos de este mes?")){items().forEach(i=>i.p=0);save();render();return}
if(t.id==="dz"){S.diezmo=!S.diezmo;save();render()}
if(t.id==="cp"){let[y,m]=S.cur.split("-").map(Number);m--;if(m<1){m=12;y--}const pk=y+"-"+String(m).padStart(2,"0");const src=(S.months[pk]||[]).filter(i=>i.t!=="extra");
if(!src.length){alert("No hay datos en el mes anterior");return}if(!confirm("Se copiarán "+src.length+" conceptos (gastos como pendientes)."))return;
src.forEach(i=>items().push({...i,id:uid(),p:0}));save();render()}
if(t.id==="ex"){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert("Respaldo copiado. Pegalo en una nota o WhatsApp.")).catch(()=>prompt("Copiá este respaldo:",j))}
if(t.id==="im"){const j=prompt("Pegá tu respaldo:");if(j){try{const o=JSON.parse(j);if(!o.months)throw 0;S=o;save();render()}catch(x){alert("Respaldo inválido")}}}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
